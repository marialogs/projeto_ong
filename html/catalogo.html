<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./../css/style_catalogo.css">
</head>

<body>
    <section class="catalogo">

        <h2>Catálogo de Doações</h2>

        <div class="cards">

            <div class="card">
                <h3>Alimentos</h3>
                <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" alt="Alimentos" height="50"
                    width="50">
                <ul>
                    <li>arroz</li>
                    <li>Feijão</li>
                    <li>leite</li>
                    <li>massa</li>
                    <li>alimentos não pereciveis</li>
                </ul>

            </div>

            <div class="card">
                <h3>Roupas</h3>
                <img src="https://png.pngtree.com/png-vector/20241108/ourlarge/pngtree-a-neat-stack-of-folded-clothes-on-white-background-illustration-png-image_14325440.png"
                    alt="Roupas">
                <p>
                    Roupas em bom estado para crianças e adultos.
                </p>

            </div>

            <div class="card">
                <h3>Brinquedos</h3>
                <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" alt="Brinquedos">



                <p>
                    Brinquedos educativos e recreativos para crianças.
                </p>

            </div>

            <div class="card">

                <img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png" alt="Higiene">

                <h3>Higiene</h3>

                <p>
                    Produtos de higiene pessoal e limpeza.
                </p>

            </div>

        </div>

    </section>
</body>

</html>
